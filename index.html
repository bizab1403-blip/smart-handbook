 body::before{
  details{ background:color-mix(in srgb, var(--card) 70%, transparent); }
  header{ background:color-mix(in srgb, var(--bg) 80%, transparent); }

details{ background:color-mix(in srgb, var(--card) 90%, transparent); }
header{ background:color-mix(in srgb, var(--bg) 92%, transparent); }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#5b6b85;--pri:#0b6bcb;--pri2:#e6f1fd;--ok:#12805c;--warn:#b45309;--bd:#dbe4f0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--tx:#e8eefb;--mut:#9fb0cc;--pri:#5aa9ff;--pri2:#16314f;--ok:#4cd1a1;--warn:#f5b461;--bd:#2a3850}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--tx:#e8eefb;--mut:#9fb0cc;--pri:#5aa9ff;--pri2:#16314f;--ok:#4cd1a1;--warn:#f5b461;--bd:#2a3850}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd)}
.top{display:flex;gap:10px;align-items:center;max-width:900px;margin:auto}
h1{font-size:18px;margin:0;flex:1}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
button,.chip{font:inherit;cursor:pointer}
.ic{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px}
.sb{max-width:900px;margin:10px auto 0}
.sb input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.sb input:focus{outline:2px solid var(--pri);border-color:transparent}
nav{max-width:900px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:auto;padding:14px}
section{margin-bottom:22px}
h2{font-size:17px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--pri)}
details[open] summary::after{content:"－"}
.em{font-size:22px}
.body{padding:2px 14px 14px;border-top:1px dashed var(--bd)}
.body h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:8px;padding:2px 8px;font-size:12px;margin-right:4px}
.ck label{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
.ck input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok)}
.ck input:checked+span{color:var(--mut);text-decoration:line-through}
ul.tips{margin:0;padding-left:20px}
.note{background:var(--pri2);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14px}
.warn{background:rgba(245,158,11,.14);color:var(--tx);border-left:4px solid var(--warn)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;text-align:center;font-size:13px;line-height:26px;font-weight:700}
.act{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;background:rgba(18,128,92,.15);color:var(--ok)}
a{color:var(--pri)}
.btn{display:inline-block;margin:3px 4px 3px 0;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd);text-decoration:none;font-size:14px}
.big{display:block;text-align:center;background:var(--pri);color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:600;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.sc{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:30px;display:none}
.reset{font-size:12px;color:var(--mut);background:none;border:0;text-decoration:underline;padding:4px 0}
</style>

let cur="all";
function apply(){const q=document.getElementById("q").value.trim().toLowerCase();let any=false;
sec.forEach(s=>{const el=document.getElementById("s-"+s[0]);let vis=0;
el.querySelectorAll("details.it").forEach(d=>{const ok=!q||d.textContent.toLowerCase().includes(q);d.style.display=ok?"":"none";if(ok){vis++;if(q&&d.querySelector(".body"))d.open=true}});

nav.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cur=b.dataset.s;nav.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));apply();scrollTo({top:0,behavior:"smooth"})};
document.getElementById("q").oninput=apply;
